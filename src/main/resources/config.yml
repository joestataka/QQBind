# QQBind 进服绑定验证配置
# 玩家进服被拦截时展示的验证码有效期（秒），默认 10 分钟
code-ttl-seconds: 600

# 一个 QQ 最多可绑定的游戏账号数量（超过后需先解绑）
max-bindings-per-qq: 3

# 完全放行的玩家名（忽略大小写），用于管理员/测试号
bypass-players: []

# OP 是否直接放行（默认关闭，避免管理员也被拦）
bypass-ops: false

# 提示文案里的 QQ 群号（玩家没加群先加）
group-ids:
  - "172945422"

# 进服拦截提示（支持 § 颜色码）
# 占位符：{player} 玩家名、{code} 验证码、{expire} 过期时间、{group} 群号
message:
  - "§4未绑定社交账号"
  - "§c{player} 进入服务器需要绑定您的社交账号"
  - ""
  - "§e如您未加群，请先加入 QQ 群：§f{group}"
  - "§e发送内容：§a绑定 {code}"
  - "§e发送后方可进入服务器"
  - ""
  - "§7请在 {expire} 前完成验证"
  - "§c请勿将验证码发送给其他人"
  - "§c验证超时后需重新进入服务器"
